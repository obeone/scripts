[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-disk-move-watcher"
version = "0.1.0"
description = "CLI tool to monitor Proxmox disk move task progress."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
pve-disk-move-watcher = "disk_move_watcher:main"

[tool.setuptools]
py-modules = ["disk_move_watcher"]
